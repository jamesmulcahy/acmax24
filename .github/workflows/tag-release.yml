name: Tag release

# When a version bump in pyproject.toml lands on main, create the matching
# v<version> tag and dispatch the publish workflow on it.
#
# Tags pushed with GITHUB_TOKEN don't trigger other workflows, so publish.yml
# is started explicitly via workflow_dispatch (which GITHUB_TOKEN is allowed to
# trigger). publish.yml stays the top-level workflow, as PyPI trusted
# publishing requires.

on:
  push:
    branches: [main]
    paths: [pyproject.toml]

concurrency:
  group: tag-release
  cancel-in-progress: false

jobs:
  tag:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # create the tag
      actions: write   # dispatch publish.yml
    steps:
      - uses: actions/checkout@v7

      - name: Read package version
        id: version
        run: |
          version="$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml","rb"))["tool"]["poetry"]["version"])')"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "tag=v${version}" >> "$GITHUB_OUTPUT"

      - name: Check whether tag already exists
        id: exists
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null; then
            echo "Tag ${TAG} already exists; nothing to do"
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create tag
        if: steps.exists.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/git/refs" \
            -f ref="refs/tags/${TAG}" -f sha="${GITHUB_SHA}"
          echo "Created ${TAG} at ${GITHUB_SHA}"

      - name: Dispatch publish workflow
        if: steps.exists.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: gh workflow run publish.yml --repo "${GITHUB_REPOSITORY}" --ref "${TAG}"
